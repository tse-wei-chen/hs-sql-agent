name: SqlCore baseline comparison

on:
  pull_request: {}
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sqlcore-comparison-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sqlcore-baseline-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: head
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || 'main' }}
          path: base
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Verify native SQL proof/comparator and code-delta contracts
        working-directory: head
        run: dotnet test --project backend/src/UnitTest/Infrastructure.Test/Infrastructure.Test.csproj --filter 'FullyQualifiedName~SqlCoreProofToolTests|FullyQualifiedName~SqlCoreComparatorProofTests'
      - name: Use identical benchmark workload against both compiler revisions
        shell: bash
        run: |
          cp head/backend/benchmarks/HsSqlAgent.SqlCore.Benchmarks/Program.cs base/backend/benchmarks/HsSqlAgent.SqlCore.Benchmarks/Program.cs
          # Program references the opt-in probe helper, so baseline and head
          # must compile with the same benchmark harness source. Its default
          # workload remains unchanged and executes neither probe path.
          cp head/backend/benchmarks/HsSqlAgent.SqlCore.Benchmarks/SqlCoreCapabilityStackProbe.cs base/backend/benchmarks/HsSqlAgent.SqlCore.Benchmarks/SqlCoreCapabilityStackProbe.cs
          cp head/backend/benchmarks/HsSqlAgent.SqlCore.Benchmarks/SqlCoreStageProfiler.cs base/backend/benchmarks/HsSqlAgent.SqlCore.Benchmarks/SqlCoreStageProfiler.cs
          mkdir -p artifacts
          git -C base rev-parse HEAD > artifacts/base-sha.txt
          git -C head rev-parse HEAD > artifacts/head-sha.txt
          dotnet build -c Release base/backend/benchmarks/HsSqlAgent.SqlCore.Benchmarks
          dotnet build -c Release head/backend/benchmarks/HsSqlAgent.SqlCore.Benchmarks
      - name: Record committed production/test/docs/generated source delta
        shell: bash
        run: |
          base_sha="$(cat artifacts/base-sha.txt)"
          head_sha="$(cat artifacts/head-sha.txt)"
          # Checkout defaults to shallow HEAD; fetch only the exact baseline,
          # never the full repository history, and compare committed content.
          git -C head fetch --no-tags --depth=1 origin "$base_sha"
          dotnet run --project head/backend/tools/HsSqlAgent.TestGovernance -- code-delta --repo head --base "$base_sha" --head "$head_sha" --output artifacts/code-delta.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Profile the existing six-provider SQL corpus by compiler stage
        shell: bash
        run: |
          dotnet run -c Release --no-build --project head/backend/benchmarks/HsSqlAgent.SqlCore.Benchmarks -- --stage-profile --iterations 5 --warmup 3 --output artifacts/stage-profile.json
          dotnet run --project head/backend/tools/HsSqlAgent.TestGovernance -- stage-profile --file artifacts/stage-profile.json
      - name: Run three interleaved pairs on the same runner and runtime
        shell: bash
        env:
          DOTNET_TieredCompilation: "0"
          DOTNET_ReadyToRun: "0"
        run: |
          for round in 1 2 3; do
            if [ "$round" = 2 ]; then order="head base"; else order="base head"; fi
            for revision in $order; do
              dotnet run -c Release --no-build --project "$revision/backend/benchmarks/HsSqlAgent.SqlCore.Benchmarks" -- \
                --iterations 300 --warmup 100 --output "artifacts/$revision-$round.json"
            done
          done
      - name: Compare Script analysis allocations and latency on identical source workloads
        shell: bash
        env:
          DOTNET_TieredCompilation: "0"
          DOTNET_ReadyToRun: "0"
        run: |
          for round in 1 2 3; do
            if [ "$round" = 2 ]; then order="head base"; else order="base head"; fi
            for revision in $order; do
              dotnet run -c Release --no-build --project "$revision/backend/benchmarks/HsSqlAgent.SqlCore.Benchmarks" -- \
                --script-analysis --iterations 120 --warmup 24 --output "artifacts/script-$revision-$round.json"
            done
          done
          dotnet run --no-build --project head/backend/tools/HsSqlAgent.TestGovernance -- paired-report --profile script --directory artifacts
      - name: Compare dense Virtual Catalog updates with identical six-dialect Scripts
        shell: bash
        env:
          DOTNET_TieredCompilation: "0"
          DOTNET_ReadyToRun: "0"
        run: |
          for round in 1 2 3; do
            if [ "$round" = 2 ]; then order="head base"; else order="base head"; fi
            for revision in $order; do
              dotnet run -c Release --no-build --project "$revision/backend/benchmarks/HsSqlAgent.SqlCore.Benchmarks" -- \
                --catalog-stress --iterations 16 --warmup 4 --output "artifacts/catalog-$revision-$round.json"
            done
          done
          dotnet run --no-build --project head/backend/tools/HsSqlAgent.TestGovernance -- paired-report --profile catalog --directory artifacts
      - name: Compare exact Catalog lookup cost on 96 and 256 table snapshots
        shell: bash
        env:
          DOTNET_TieredCompilation: "0"
          DOTNET_ReadyToRun: "0"
        run: |
          for round in 1 2 3; do
            if [ "$round" = 2 ]; then order="head base"; else order="base head"; fi
            for revision in $order; do
              dotnet run -c Release --no-build --project "$revision/backend/benchmarks/HsSqlAgent.SqlCore.Benchmarks" -- \
                --catalog-lookup --iterations 150 --warmup 20 --output "artifacts/catalog-lookup-$revision-$round.json"
            done
          done
          dotnet run --no-build --project head/backend/tools/HsSqlAgent.TestGovernance -- paired-report --profile catalog-lookup --directory artifacts
      - name: Compare shared Name Type Catalog projection against exact develop baseline
        shell: bash
        env:
          DOTNET_TieredCompilation: "0"
          DOTNET_ReadyToRun: "0"
        run: |
          for round in 1 2 3; do
            if [ "$round" = 2 ]; then order="head base"; else order="base head"; fi
            for revision in $order; do
              dotnet run -c Release --no-build --project "$revision/backend/benchmarks/HsSqlAgent.SqlCore.Benchmarks" -- \
                --catalog-binding-stress --iterations 12 --warmup 3 --output "artifacts/binding-$revision-$round.json"
            done
          done
          dotnet run --no-build --project head/backend/tools/HsSqlAgent.TestGovernance -- paired-report --profile binding --directory artifacts
      - name: Compare proven reverse View cascade closure on identical base/head
        shell: bash
        env:
          DOTNET_TieredCompilation: "0"
          DOTNET_ReadyToRun: "0"
        run: |
          for round in 1 2 3; do
            if [ "$round" = 2 ]; then order="head base"; else order="base head"; fi
            for revision in $order; do
              dotnet run -c Release --no-build --project "$revision/backend/benchmarks/HsSqlAgent.SqlCore.Benchmarks" -- \
                --view-cascade-stress --iterations 30 --warmup 5 --output "artifacts/view-cascade-$revision-$round.json"
            done
          done
          dotnet run --no-build --project head/backend/tools/HsSqlAgent.TestGovernance -- paired-report --profile view-cascade --directory artifacts
      - name: Compare six-provider Normalization AST walks on proven source capabilities
        shell: bash
        env:
          DOTNET_TieredCompilation: "0"
          DOTNET_ReadyToRun: "0"
        run: |
          for round in 1 2 3; do
            if [ "$round" = 2 ]; then order="head base"; else order="base head"; fi
            for revision in $order; do
              dotnet run -c Release --no-build --project "$revision/backend/benchmarks/HsSqlAgent.SqlCore.Benchmarks" -- \
                --stage-profile --iterations 12 --warmup 4 --output "artifacts/regex-stage-$revision-$round.json"
            done
          done
          dotnet run --no-build --project head/backend/tools/HsSqlAgent.TestGovernance -- paired-report --profile normalization --directory artifacts
      - name: Compare six-provider Validation proof walks on identical 48-case corpus
        shell: bash
        env:
          DOTNET_TieredCompilation: "0"
          DOTNET_ReadyToRun: "0"
        run: |
          for round in 1 2 3; do
            if [ "$round" = 2 ]; then order="head base"; else order="base head"; fi
            for revision in $order; do
              dotnet run -c Release --no-build --project "$revision/backend/benchmarks/HsSqlAgent.SqlCore.Benchmarks" -- \
                --stage-profile --iterations 12 --warmup 4 --output "artifacts/validation-stage-$revision-$round.json"
            done
          done
          dotnet run --no-build --project head/backend/tools/HsSqlAgent.TestGovernance -- paired-report --profile validation --directory artifacts
      - name: Enforce full corpus, output parity and broad regression ceilings
        run: dotnet run --project head/backend/tools/HsSqlAgent.TestGovernance -- perf-compare --directory artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sqlcore-baseline-comparison
          path: artifacts/
          if-no-files-found: error
