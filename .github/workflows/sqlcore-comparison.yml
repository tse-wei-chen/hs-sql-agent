name: SqlCore baseline comparison

on:
  pull_request: {}
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sqlcore-comparison-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sqlcore-baseline-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: head
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || 'main' }}
          path: base
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Verify comparator and code-delta classification contracts
        run: |
          python3 -m unittest discover -s head/.github/scripts -p test_sqlcore_perf_comparison.py
          python3 -m unittest discover -s head/.github/scripts -p test_sqlcore_code_delta.py
          python3 -m unittest discover -s head/.github/scripts -p test_sqlcore_stage_profile.py
      - name: Use identical benchmark workload against both compiler revisions
        shell: bash
        run: |
          cp head/backend/benchmarks/HsSqlAgent.SqlCore.Benchmarks/Program.cs base/backend/benchmarks/HsSqlAgent.SqlCore.Benchmarks/Program.cs
          # Program references the opt-in probe helper, so baseline and head
          # must compile with the same benchmark harness source. Its default
          # workload remains unchanged and executes neither probe path.
          cp head/backend/benchmarks/HsSqlAgent.SqlCore.Benchmarks/SqlCoreCapabilityStackProbe.cs base/backend/benchmarks/HsSqlAgent.SqlCore.Benchmarks/SqlCoreCapabilityStackProbe.cs
          cp head/backend/benchmarks/HsSqlAgent.SqlCore.Benchmarks/SqlCoreStageProfiler.cs base/backend/benchmarks/HsSqlAgent.SqlCore.Benchmarks/SqlCoreStageProfiler.cs
          mkdir -p artifacts
          git -C base rev-parse HEAD > artifacts/base-sha.txt
          git -C head rev-parse HEAD > artifacts/head-sha.txt
          dotnet build -c Release base/backend/benchmarks/HsSqlAgent.SqlCore.Benchmarks
          dotnet build -c Release head/backend/benchmarks/HsSqlAgent.SqlCore.Benchmarks
      - name: Record committed production/test/docs/generated source delta
        shell: bash
        run: |
          base_sha="$(cat artifacts/base-sha.txt)"
          head_sha="$(cat artifacts/head-sha.txt)"
          # Checkout defaults to shallow HEAD; fetch only the exact baseline,
          # never the full repository history, and compare committed content.
          git -C head fetch --no-tags --depth=1 origin "$base_sha"
          python3 head/.github/scripts/sqlcore_code_delta.py head "$base_sha" "$head_sha" artifacts/code-delta.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Profile the existing six-provider SQL corpus by compiler stage
        shell: bash
        run: |
          dotnet run -c Release --no-build --project head/backend/benchmarks/HsSqlAgent.SqlCore.Benchmarks -- --stage-profile --iterations 5 --warmup 3 --output artifacts/stage-profile.json
          python3 head/.github/scripts/verify_sqlcore_stage_profile.py artifacts/stage-profile.json
      - name: Run three interleaved pairs on the same runner and runtime
        shell: bash
        env:
          DOTNET_TieredCompilation: "0"
          DOTNET_ReadyToRun: "0"
        run: |
          for round in 1 2 3; do
            if [ "$round" = 2 ]; then order="head base"; else order="base head"; fi
            for revision in $order; do
              dotnet run -c Release --no-build --project "$revision/backend/benchmarks/HsSqlAgent.SqlCore.Benchmarks" -- \
                --iterations 300 --warmup 100 --output "artifacts/$revision-$round.json"
            done
          done
      - name: Enforce full corpus, output parity and broad regression ceilings
        run: python3 head/.github/scripts/compare-sqlcore-perf.py artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sqlcore-baseline-comparison
          path: artifacts/
          if-no-files-found: error
