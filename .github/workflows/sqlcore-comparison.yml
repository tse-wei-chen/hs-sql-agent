name: SqlCore baseline comparison

on:
  pull_request: {}
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sqlcore-comparison-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sqlcore-baseline-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: head
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || 'main' }}
          path: base
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Verify comparator and code-delta classification contracts
        run: |
          python3 -m unittest discover -s head/.github/scripts -p test_sqlcore_perf_comparison.py
          python3 -m unittest discover -s head/.github/scripts -p test_sqlcore_code_delta.py
          python3 -m unittest discover -s head/.github/scripts -p test_sqlcore_stage_profile.py
      - name: Use identical benchmark workload against both compiler revisions
        shell: bash
        run: |
          cp head/backend/benchmarks/HsSqlAgent.SqlCore.Benchmarks/Program.cs base/backend/benchmarks/HsSqlAgent.SqlCore.Benchmarks/Program.cs
          # Program references the opt-in probe helper, so baseline and head
          # must compile with the same benchmark harness source. Its default
          # workload remains unchanged and executes neither probe path.
          cp head/backend/benchmarks/HsSqlAgent.SqlCore.Benchmarks/SqlCoreCapabilityStackProbe.cs base/backend/benchmarks/HsSqlAgent.SqlCore.Benchmarks/SqlCoreCapabilityStackProbe.cs
          cp head/backend/benchmarks/HsSqlAgent.SqlCore.Benchmarks/SqlCoreStageProfiler.cs base/backend/benchmarks/HsSqlAgent.SqlCore.Benchmarks/SqlCoreStageProfiler.cs
          mkdir -p artifacts
          git -C base rev-parse HEAD > artifacts/base-sha.txt
          git -C head rev-parse HEAD > artifacts/head-sha.txt
          dotnet build -c Release base/backend/benchmarks/HsSqlAgent.SqlCore.Benchmarks
          dotnet build -c Release head/backend/benchmarks/HsSqlAgent.SqlCore.Benchmarks
      - name: Record committed production/test/docs/generated source delta
        shell: bash
        run: |
          base_sha="$(cat artifacts/base-sha.txt)"
          head_sha="$(cat artifacts/head-sha.txt)"
          # Checkout defaults to shallow HEAD; fetch only the exact baseline,
          # never the full repository history, and compare committed content.
          git -C head fetch --no-tags --depth=1 origin "$base_sha"
          python3 head/.github/scripts/sqlcore_code_delta.py head "$base_sha" "$head_sha" artifacts/code-delta.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Profile the existing six-provider SQL corpus by compiler stage
        shell: bash
        run: |
          dotnet run -c Release --no-build --project head/backend/benchmarks/HsSqlAgent.SqlCore.Benchmarks -- --stage-profile --iterations 5 --warmup 3 --output artifacts/stage-profile.json
          python3 head/.github/scripts/verify_sqlcore_stage_profile.py artifacts/stage-profile.json
      - name: Run three interleaved pairs on the same runner and runtime
        shell: bash
        env:
          DOTNET_TieredCompilation: "0"
          DOTNET_ReadyToRun: "0"
        run: |
          for round in 1 2 3; do
            if [ "$round" = 2 ]; then order="head base"; else order="base head"; fi
            for revision in $order; do
              dotnet run -c Release --no-build --project "$revision/backend/benchmarks/HsSqlAgent.SqlCore.Benchmarks" -- \
                --iterations 300 --warmup 100 --output "artifacts/$revision-$round.json"
            done
          done
      - name: Compare Script analysis allocations and latency on identical source workloads
        shell: bash
        env:
          DOTNET_TieredCompilation: "0"
          DOTNET_ReadyToRun: "0"
        run: |
          for round in 1 2 3; do
            if [ "$round" = 2 ]; then order="head base"; else order="base head"; fi
            for revision in $order; do
              dotnet run -c Release --no-build --project "$revision/backend/benchmarks/HsSqlAgent.SqlCore.Benchmarks" -- \
                --script-analysis --iterations 120 --warmup 24 --output "artifacts/script-$revision-$round.json"
            done
          done
          python3 - <<'PY'
          import json, statistics
          from pathlib import Path
          root = Path("artifacts")
          samples = {side: [] for side in ("base", "head")}
          for side in samples:
              for run in range(1, 4):
                  report = json.loads((root / f"script-{side}-{run}.json").read_text())
                  rows = {(x["Provider"], x["Case"]): x for x in report["results"]}
                  assert len(rows) == 12, (side, run, "Expected six dialects x two Script workloads")
                  samples[side].append(rows)
          keys = sorted(samples["base"][0])
          lines = ["### Script analysis reuse (median of 3 same-runner rounds)",
                   "| Dialect / workload | Candidate/base allocation | Candidate/base mean time |",
                   "|---|---:|---:|"]
          for key in keys:
              old = [run[key] for run in samples["base"]]
              new = [run[key] for run in samples["head"]]
              assert len({r["OutputDigest"] for r in old + new}) == 1, (key, "Script result parity drift")
              ratios = []
              for metric in ("MeanAllocatedBytes", "MeanMicroseconds"):
                  base = statistics.median(r[metric] for r in old)
                  head = statistics.median(r[metric] for r in new)
                  assert base > 0 and head > 0, (key, metric, base, head)
                  ratios.append(f"{head/base:.3f}x")
              lines.append(f"| {key[0]} / {key[1]} | {ratios[0]} | {ratios[1]} |")
          output = "\n".join(lines)
          print(output)
          with open("artifacts/script-comparison.md", "w") as file:
              file.write(output + "\n")
          with open(__import__("os").environ["GITHUB_STEP_SUMMARY"], "a") as file:
              file.write(output + "\n")
          PY
      - name: Compare dense Virtual Catalog updates with identical six-dialect Scripts
        shell: bash
        env:
          DOTNET_TieredCompilation: "0"
          DOTNET_ReadyToRun: "0"
        run: |
          for round in 1 2 3; do
            if [ "$round" = 2 ]; then order="head base"; else order="base head"; fi
            for revision in $order; do
              dotnet run -c Release --no-build --project "$revision/backend/benchmarks/HsSqlAgent.SqlCore.Benchmarks" -- \
                --catalog-stress --iterations 16 --warmup 4 --output "artifacts/catalog-$revision-$round.json"
            done
          done
          python3 - <<'PY'
          import json, os, statistics
          from pathlib import Path
          root = Path("artifacts")
          samples = {side: [] for side in ("base", "head")}
          for side in samples:
              for round in range(1, 4):
                  data = json.loads((root / f"catalog-{side}-{round}.json").read_text())
                  rows = {(row["Provider"], row["Case"]): row for row in data["results"]}
                  assert len(rows) == 12, (side, round, "Expected six dialects x two table counts")
                  samples[side].append(rows)
          lines = ["### Virtual Catalog stress comparison (median of three paired runs)",
                   "| Dialect / workload | Candidate/base allocated | Candidate/base mean time |",
                   "|---|---:|---:|"]
          for key in sorted(samples["base"][0]):
              old = [round[key] for round in samples["base"]]
              new = [round[key] for round in samples["head"]]
              assert len({row["OutputDigest"] for row in old + new}) == 1, (key, "Catalog analysis output changed")
              ratios = []
              for field in ("MeanAllocatedBytes", "MeanMicroseconds"):
                  a = statistics.median(row[field] for row in old)
                  b = statistics.median(row[field] for row in new)
                  assert a > 0 and b > 0
                  ratios.append(f"{b/a:.3f}x")
              lines.append(f"| {key[0]} / {key[1]} | {ratios[0]} | {ratios[1]} |")
          report = "\n".join(lines) + "\n"
          print(report)
          (root / "catalog-comparison.md").write_text(report)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as file:
              file.write(report)
          PY
      - name: Enforce full corpus, output parity and broad regression ceilings
        run: python3 head/.github/scripts/compare-sqlcore-perf.py artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sqlcore-baseline-comparison
          path: artifacts/
          if-no-files-found: error
