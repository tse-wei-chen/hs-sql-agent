  sql-syntax-parity:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build differential parity runner
        run: dotnet build .github/tools/SqlSyntaxParityRunner/SqlSyntaxParityRunner.csproj --configuration Release
      - name: Build PR SqlCore
        run: dotnet build backend/src/Modules/HsSqlAgent.SqlCore/HsSqlAgent.SqlCore.fsproj --configuration Release --output artifacts/parity/head
      - name: Capture PR syntax behavior
        run: >
          dotnet run --project .github/tools/SqlSyntaxParityRunner/SqlSyntaxParityRunner.csproj
          --configuration Release --no-build --
          run artifacts/parity/head/HsSqlAgent.SqlCore.dll
          backend/src/UnitTest/SqlAgent.Test/SyntaxCorpus/sql-main-compatibility-floor.json
          artifacts/parity/head.json
      - name: Capture PR generated syntax behavior
        run: >
          dotnet run --project .github/tools/SqlSyntaxParityRunner/SqlSyntaxParityRunner.csproj
          --configuration Release --no-build --
          run artifacts/parity/head/HsSqlAgent.SqlCore.dll
          backend/src/UnitTest/SqlAgent.Test/SyntaxCorpus/sql-generated-compatibility-floor.json
          artifacts/parity/head-generated.json
      - name: Capture PR generated recursive syntax behavior
        run: >
          dotnet run --project .github/tools/SqlSyntaxParityRunner/SqlSyntaxParityRunner.csproj
          --configuration Release --no-build --
          run artifacts/parity/head/HsSqlAgent.SqlCore.dll
          backend/src/UnitTest/SqlAgent.Test/SyntaxCorpus/sql-generated-recursive-compatibility-floor.json
          artifacts/parity/head-generated-recursive.json
      - name: Capture PR generated PostgreSQL native syntax behavior
        run: >
          dotnet run --project .github/tools/SqlSyntaxParityRunner/SqlSyntaxParityRunner.csproj
          --configuration Release --no-build --
          run artifacts/parity/head/HsSqlAgent.SqlCore.dll
          backend/src/UnitTest/SqlAgent.Test/SyntaxCorpus/sql-generated-postgres-native-compatibility-floor.json
          artifacts/parity/head-generated-postgres-native.json
      - name: Capture PR generated PostgreSQL quoted-function syntax behavior
        run: >
          dotnet run --project .github/tools/SqlSyntaxParityRunner/SqlSyntaxParityRunner.csproj
          --configuration Release --no-build --
          run artifacts/parity/head/HsSqlAgent.SqlCore.dll
          backend/src/UnitTest/SqlAgent.Test/SyntaxCorpus/sql-generated-postgres-quoted-function-compatibility-floor.json
          artifacts/parity/head-generated-postgres-quoted-function.json
      - name: Capture PR generated PostgreSQL distinct-from syntax behavior
        run: >
          dotnet run --project .github/tools/SqlSyntaxParityRunner/SqlSyntaxParityRunner.csproj
          --configuration Release --no-build --
          run artifacts/parity/head/HsSqlAgent.SqlCore.dll
          backend/src/UnitTest/SqlAgent.Test/SyntaxCorpus/sql-generated-postgres-distinct-from-compatibility-floor.json
          artifacts/parity/head-generated-postgres-distinct-from.json
      - name: Capture PR generated CAST type syntax behavior
        run: >
          dotnet run --project .github/tools/SqlSyntaxParityRunner/SqlSyntaxParityRunner.csproj
          --configuration Release --no-build --
          run artifacts/parity/head/HsSqlAgent.SqlCore.dll
          backend/src/UnitTest/SqlAgent.Test/SyntaxCorpus/sql-generated-cast-type-compatibility-floor.json
          artifacts/parity/head-generated-cast-type.json
      - name: Capture PR generated Oracle native syntax behavior
        run: >
          dotnet run --project .github/tools/SqlSyntaxParityRunner/SqlSyntaxParityRunner.csproj
          --configuration Release --no-build --
          run artifacts/parity/head/HsSqlAgent.SqlCore.dll
          backend/src/UnitTest/SqlAgent.Test/SyntaxCorpus/sql-generated-oracle-native-compatibility-floor.json
          artifacts/parity/head-generated-oracle-native.json
      - name: Capture PR generated profile-sensitive syntax behavior
        run: >
          dotnet run --project .github/tools/SqlSyntaxParityRunner/SqlSyntaxParityRunner.csproj
          --configuration Release --no-build --
          run artifacts/parity/head/HsSqlAgent.SqlCore.dll
          backend/src/UnitTest/SqlAgent.Test/SyntaxCorpus/sql-generated-profile-sensitive-compatibility-floor.json
          artifacts/parity/head-generated-profile-sensitive.json
      - name: Capture PR generated DML behavior
