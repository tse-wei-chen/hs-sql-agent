  sqlagent-package-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable pnpm
        run: corepack enable pnpm
      - name: Verify SqlCore identity cutover
        shell: bash
        run: |
          set -euo pipefail
          project=backend/src/Modules/HsSqlAgent.SqlCore/HsSqlAgent.SqlCore.fsproj
          test -f "$project"
          grep -Fq '<PackageId>HsSqlAgent.SqlCore</PackageId>' "$project"
          grep -Fq '<AssemblyName>HsSqlAgent.SqlCore</AssemblyName>' "$project"
          grep -Fq 'COPY backend/src/Modules/HsSqlAgent.SqlCore/HsSqlAgent.SqlCore.fsproj ./backend/src/Modules/HsSqlAgent.SqlCore/' Dockerfile
          stale_identity='HsSqlAgent.SqlCore''.FSharp'
          if grep -RIn \
              --exclude-dir=.git \
              --include='*.csproj' \
              --include='*.fsproj' \
              --include='*.slnx' \
              --include='*.yml' \
              --include='*.yaml' \
              "$stale_identity" .github backend \
             || grep -n "$stale_identity" Dockerfile; then
            echo "Stale temporary SqlCore.FSharp identity remains." >&2
            exit 1
          fi
      - name: Pack public NuGet packages
        shell: bash
        run: |
          set -euo pipefail
          projects=(
            backend/src/Modules/HsSqlAgent.SqlCore/HsSqlAgent.SqlCore.fsproj
            backend/src/Modules/HsSqlAgent.Provider.Abstractions/HsSqlAgent.Provider.Abstractions.csproj
            backend/src/Modules/HsSqlAgent.Provider.PostgreSql/HsSqlAgent.Provider.PostgreSql.csproj
            backend/src/Modules/HsSqlAgent.Provider.MySql/HsSqlAgent.Provider.MySql.csproj
            backend/src/Modules/HsSqlAgent.Provider.Sqlite/HsSqlAgent.Provider.Sqlite.csproj
            backend/src/Modules/HsSqlAgent.Provider.SqlServer/HsSqlAgent.Provider.SqlServer.csproj
            backend/src/Modules/HsSqlAgent.Provider.Oracle/HsSqlAgent.Provider.Oracle.csproj
            backend/src/Modules/HsSqlAgent.Provider.Firebird/HsSqlAgent.Provider.Firebird.csproj
            backend/src/Modules/HsSqlAgent.Server/HsSqlAgent.Server.csproj
          )
          for project in "${projects[@]}"; do
            dotnet pack "$project" --configuration Release --output artifacts/packages
          done
      - name: Smoke test packed Server package
        shell: bash
        run: bash .github/scripts/nuget-consumer-smoke.sh artifacts/packages


