  sqlagent-fence-sqlserver:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Strong_Password_123!"
          MSSQL_PID: "Developer"
        ports:
          - 1433:1433
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Verify SQL Server Host DDL real transactional CREATE TABLE proof
        run: >
          dotnet test --project backend/src/UnitTest/HsSqlAgent.Server.Test/HsSqlAgent.Server.Test.csproj
          --filter 'FullyQualifiedName~SqlCoreSqlServerDdlHostLiveTests'
        env:
          TEST_SQLSERVER_CONNECTION: "Server=localhost,1433;Database=master;User Id=sa;Password=Strong_Password_123!;TrustServerCertificate=True;Encrypt=False;Pooling=False;Connect Timeout=5"
      - name: Verify SQL Server physical native-function Query whitelist fence
        run: >
          dotnet test --project backend/src/UnitTest/HsSqlAgent.Server.Test/HsSqlAgent.Server.Test.csproj
          --filter 'FullyQualifiedName~QueryNativeFunctionLiveTests.SqlServer_'
        env:
          TEST_SQLSERVER_CONNECTION: "Server=localhost,1433;Database=master;User Id=sa;Password=Strong_Password_123!;TrustServerCertificate=True;Encrypt=False;Pooling=False;Connect Timeout=5"
      - name: Verify real SQL Server DML fencing and DDL Catalog differential parity
        # Dedicated service job to keep the regular SQL test shards lightweight.
        # Missing/unready SQL Server is a hard failure in CI, never a skip.
        # The same live SQL Server 2022 instance is reused by ordered steps.
        run: >
          dotnet test --project backend/src/UnitTest/SqlAgent.Test/SqlAgent.Test.csproj
          --filter 'FullyQualifiedName~DmlTargetFenceSqlServerIntegrationTests|FullyQualifiedName~SqlCoreSqlServerLiveDdlParityTests|FullyQualifiedName~SqlCoreSqlServerApplyLiveParityTests|FullyQualifiedName~SqlCoreSqlServerWithMutationCteLiveParityTests|FullyQualifiedName~SqlCoreSqlServerWithInsertSelectLiveParityTests|FullyQualifiedName~SqlCoreSqlServerWithJoinedMutationSingletonLiveParityTests|FullyQualifiedName~SqlCoreSqlServerLiveUniqueKeyAttestationTests|FullyQualifiedName~SqlCoreSqlServerCompositeCteLiveProofTests|FullyQualifiedName~SqlCoreBoundedExactNumericLiveParityTests'
        env:
          TEST_SQLSERVER_CONNECTION: "Server=localhost,1433;Database=master;User Id=sa;Password=Strong_Password_123!;TrustServerCertificate=True;Encrypt=False;Pooling=False;Connect Timeout=5"
          SQLCORE_EXACT_NUMERIC_LIVE_PROVIDER: MsSqlServer
      - name: Verify bounded SQL Server INSERT SELECT source-row approval against live physical tables
        # These transactional TABLOCKX/HOLDLOCK tests must not race unrelated
        # sys-catalog DDL fixtures running in parallel within the same DB.
        # Keep ALL cases; isolate only this class, in the existing SQL Server job.
        run: >
          dotnet test --project backend/src/UnitTest/SqlAgent.Test/SqlAgent.Test.csproj
          --filter 'FullyQualifiedName~DmlSqlServerInsertSelectApprovalTests'
        env:
          TEST_SQLSERVER_CONNECTION: "Server=localhost,1433;Database=master;User Id=sa;Password=Strong_Password_123!;TrustServerCertificate=True;Encrypt=False;Pooling=False;Connect Timeout=5"
      - name: Verify SQL Server M10 MERGE HOLDLOCK, live unique-key and key-range serialization
        # Real SQL Server only, isolated from parallel master sys-catalog DDL tests.
        # A missing SQL Server connection fails CI; never run these on general shards.
        run: >
          dotnet test --project backend/src/UnitTest/SqlAgent.Test/SqlAgent.Test.csproj
          --filter 'FullyQualifiedName~SqlCoreSqlServerMergeHoldLockLiveTests'
        env:
          TEST_SQLSERVER_CONNECTION: "Server=localhost,1433;Database=master;User Id=sa;Password=Strong_Password_123!;TrustServerCertificate=True;Encrypt=False;Pooling=False;Connect Timeout=5"

      - name: Verify G10 LAG LEAD IGNORE NULLS on real SQL Server 2022
        run: >
          dotnet test --project backend/src/UnitTest/SqlAgent.Test/SqlAgent.Test.csproj
          --filter 'FullyQualifiedName~SqlCoreSqlServerWindowNullTreatmentLiveTests'
        env:
          TEST_SQLSERVER_CONNECTION: "Server=localhost,1433;Database=master;User Id=sa;Password=Strong_Password_123!;TrustServerCertificate=True;Encrypt=False;Pooling=False;Connect Timeout=5"

      - name: Verify G10 filtered DISTINCT COUNT on real SQL Server 2022
        run: >
          dotnet test --project backend/src/UnitTest/SqlAgent.Test/SqlAgent.Test.csproj
          --filter 'FullyQualifiedName~SqlCoreFilteredDistinctCountSqlServerLiveTests'
        env:
          TEST_SQLSERVER_CONNECTION: "Server=localhost,1433;Database=master;User Id=sa;Password=Strong_Password_123!;TrustServerCertificate=True;Encrypt=False;Pooling=False;Connect Timeout=5"

      - name: Verify G10 bounded COUNT FILTER lowering on real SQL Server 2022
        run: >
          dotnet test --project backend/src/UnitTest/SqlAgent.Test/SqlAgent.Test.csproj
          --filter 'FullyQualifiedName~SqlCoreFilteredCountSqlServerLiveTests'
        env:
          TEST_SQLSERVER_CONNECTION: "Server=localhost,1433;Database=master;User Id=sa;Password=Strong_Password_123!;TrustServerCertificate=True;Encrypt=False;Pooling=False;Connect Timeout=5"

      - name: Verify SQL Server MERGE MATCHED DELETE Host Preview, Approval and Commit on live key
        run: >
          dotnet test --project backend/src/UnitTest/HsSqlAgent.Server.Test/HsSqlAgent.Server.Test.csproj
          --filter 'FullyQualifiedName~SqlServerMergeMatchedDeleteApprovalLiveTests'
        env:
          TEST_SQLSERVER_CONNECTION: "Server=localhost,1433;Database=master;User Id=sa;Password=Strong_Password_123!;TrustServerCertificate=True;Encrypt=False;Pooling=False;Connect Timeout=5"

      - name: Verify SQL Server MERGE MATCHED UPDATE physical row-value approval in real SQL Server 2022
        run: >
          dotnet test --project backend/src/UnitTest/HsSqlAgent.Server.Test/HsSqlAgent.Server.Test.csproj
          --filter 'FullyQualifiedName~SqlServerMergeMatchedUpdateApprovalLiveTests'
        env:
          TEST_SQLSERVER_CONNECTION: "Server=localhost,1433;Database=master;User Id=sa;Password=Strong_Password_123!;TrustServerCertificate=True;Encrypt=False;Pooling=False;Connect Timeout=5"

      - name: Verify SQL Server MERGE NOT MATCHED INSERT real key absence and payload approval
        run: >
          dotnet test --project backend/src/UnitTest/HsSqlAgent.Server.Test/HsSqlAgent.Server.Test.csproj
          --filter 'FullyQualifiedName~SqlServerMergeNotMatchedInsertApprovalLiveTests'
        env:
          TEST_SQLSERVER_CONNECTION: "Server=localhost,1433;Database=master;User Id=sa;Password=Strong_Password_123!;TrustServerCertificate=True;Encrypt=False;Pooling=False;Connect Timeout=5"

