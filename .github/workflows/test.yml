name: Tests

on:
  push:
    branches: [main]
  pull_request: {}
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  infrastructure-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet test --project backend/src/UnitTest/Infrastructure.Test/Infrastructure.Test.csproj

  auth-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet test --project backend/src/UnitTest/Auth.Test/Auth.Test.csproj

  admin-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet test --project backend/src/UnitTest/Admin.Test/Admin.Test.csproj

  server-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Verify released v2.0.6 Admin Store migration baseline is immutable
        shell: bash
        run: bash .github/scripts/verify-v2-admin-migration-baseline.sh
      - name: Run server unit tests (excluding explicit Redis integration suite)
        run: dotnet test --project backend/src/UnitTest/HsSqlAgent.Server.Test/HsSqlAgent.Server.Test.csproj --filter 'FullyQualifiedName!~RedisDmlApprovalIntegrationTests'

  redis-approval-integration:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Verify real Redis and run cross-instance approval races
        run: |
          test -n "${HS_SQL_AGENT_REDIS_INTEGRATION_CONNECTION:?Redis service is required}"
          dotnet test --project backend/src/UnitTest/HsSqlAgent.Server.Test/HsSqlAgent.Server.Test.csproj --filter 'FullyQualifiedName~RedisDmlApprovalIntegrationTests'
        env:
          HS_SQL_AGENT_REDIS_INTEGRATION_CONNECTION: "localhost:6379,abortConnect=true,connectTimeout=5000"

  sqlagent-capability-stack:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Gate six-provider 256 KiB capability and DML stacks (Debug)
        run: >
          dotnet run -c Debug
          --project backend/benchmarks/HsSqlAgent.SqlCore.Benchmarks --
          --capability-stack-probe --output artifacts/sqlcore-capability-stack-debug.json
      - name: Gate six-provider 256 KiB capability and DML stacks (Release)
        run: >
          dotnet run -c Release
          --project backend/benchmarks/HsSqlAgent.SqlCore.Benchmarks --
          --capability-stack-probe --output artifacts/sqlcore-capability-stack-release.json
      - name: Upload isolated stack evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sqlcore-capability-stack-evidence
          path: artifacts/sqlcore-capability-stack-*.json
          if-no-files-found: warn

  sqlagent-syntax-matrix:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Run generated SQL grammar matrices
        run: dotnet test --project backend/src/UnitTest/SqlAgent.Test/SqlAgent.Test.csproj --filter '(FullyQualifiedName~GrammarMatrixTests|FullyQualifiedName~MutationMatrixTests|FullyQualifiedName~NegativeBindingPolicyMatrixTests|FullyQualifiedName~NegativeTargetCapabilityMatrixTests|FullyQualifiedName~NegativeTablePolicyMatrixTests|FullyQualifiedName~SqlGrammarBombardmentCoverageTests)'
      - name: Validate SQL compiler benchmark harness (smoke only)
        run: dotnet run -c Release --project backend/benchmarks/HsSqlAgent.SqlCore.Benchmarks -- --smoke
      - name: Probe SQL expression nesting in isolated subprocesses (smoke only)
        run: dotnet run -c Release --no-build --project backend/benchmarks/HsSqlAgent.SqlCore.Benchmarks -- --depth-probe --smoke
      - name: Record all-dialect deep SQL behavior (isolated, observational)
        run: >
          dotnet run -c Release --no-build
          --project backend/benchmarks/HsSqlAgent.SqlCore.Benchmarks --
          --depth-probe --dialects Postgres,MySQL,Sqlite,MsSqlServer,Oracle,Firebird
          --depths 128,512,2048
          --output artifacts/sqlcore-depth-pr.json
      - name: Print high-depth SQL allocation and crash evidence
        if: always()
        shell: bash
        run: |
          if test ! -f artifacts/sqlcore-depth-pr.json; then
            echo "Depth report missing; preceding step failed." >&2
            exit 1
          fi
          python3 - <<'PY'
          import json
          with open("artifacts/sqlcore-depth-pr.json", encoding="utf-8") as src:
              report = json.load(src)
          print(f"Depth probe: samples={report['samples']} failures={report['failures']} crashesOrTimeouts={report['crashesOrTimeouts']}")
          for item in report["observations"]:
              worker = item.get("worker") or {}
              status = "ok" if worker.get("success") else "FAILED"
              print(f"{item['dialect']:12} {item['shape']:23} depth={item['depth']:4} status={status:6} allocatedBytes={worker.get('allocatedBytes')} elapsedUs={worker.get('elapsedMicroseconds')} exitCode={item['processExitCode']}")
          PY
      - name: Characterize mixed Expr/EXISTS Query nesting (isolated, observational)
        run: >
          dotnet run -c Release --no-build
          --project backend/benchmarks/HsSqlAgent.SqlCore.Benchmarks --
          --depth-probe --dialects Postgres,Oracle
          --shapes mixed-query-graph --depths 128,512,2048
          --output artifacts/sqlcore-mixed-depth-pr.json
      - name: Print mixed Query depth outcomes
        if: always()
        shell: bash
        run: |
          if test ! -f artifacts/sqlcore-mixed-depth-pr.json; then
            echo "Mixed Query depth report missing; preceding step failed." >&2
            exit 1
          fi
          python3 - <<'PY'
          import json
          with open("artifacts/sqlcore-mixed-depth-pr.json", encoding="utf-8") as source:
              report = json.load(source)
          print(f"Mixed Query depth: samples={report['samples']} failures={report['failures']} crashesOrTimeouts={report['crashesOrTimeouts']}")
          for item in report["observations"]:
              worker = item.get("worker") or {}
              status = "ok" if worker.get("success") else "FAILED"
              print(f"{item['dialect']:12} depth={item['depth']:4} status={status:6} allocatedBytes={worker.get('allocatedBytes')} exitCode={item['processExitCode']} code={worker.get('diagnosticCode')} error={worker.get('error')}")
          # This guard does not claim arbitrary-depth SQL support. It
          # locks in the measured improvement for one deterministic shape,
          # with >4x headroom for runtime/JIT variance. The previous
          # quadratic implementation allocated >269 MB at 2,048 layers.
          if report["samples"] != 6 or report["failures"] != 0 or report["crashesOrTimeouts"] != 0:
              raise SystemExit("Mixed Query depth floor regressed: all six probes must compile.")
          for item in report["observations"]:
              worker = item.get("worker") or {}
              if not worker.get("success") or item["processExitCode"] != 0:
                  raise SystemExit("Mixed Query probe must compile: "
                                   + str((item["dialect"], item["depth"])))
              if item["depth"] == 2048 and (
                  not isinstance(worker.get("allocatedBytes"), int)
                  or worker["allocatedBytes"] > 120_000_000
              ):
                  raise SystemExit("Mixed Query 2,048-depth allocation exceeded 120 MB: "
                                   + str((item["dialect"], worker.get("allocatedBytes"))))
          PY
      - name: Profile nested derived and CTE query phases (isolated, observational)
        run: >
          dotnet run -c Release --no-build
          --project backend/benchmarks/HsSqlAgent.SqlCore.Benchmarks --
          --depth-probe --dialects Postgres
          --shapes nested-derived-source,nested-cte,nested-cte-typed-schema --depths 128,512,2048
          --output artifacts/sqlcore-query-phases-pr.json
      - name: Inspect per-stage query profiling and resource exits
        if: always()
        shell: bash
        run: |
          if test ! -f artifacts/sqlcore-query-phases-pr.json; then
            echo "Nested Query phase report missing." >&2
            exit 1
          fi
          python3 - <<'PY'
          import json
          with open("artifacts/sqlcore-query-phases-pr.json", encoding="utf-8") as src:
              report = json.load(src)
          print(f"Nested Query stages: samples={report['samples']} failures={report['failures']} crashesOrTimeouts={report['crashesOrTimeouts']}")
          required = {"Parsing", "Binding", "Normalization", "Validation", "Policy", "Rendering"}
          for item in report["observations"]:
              worker = item.get("worker") or {}
              metrics = worker.get("stageMetrics") or []
              phases = {phase.get("Stage") for phase in metrics if phase.get("Success")}
              print(f"{item['shape']:23} depth={item['depth']:4} code={worker.get('diagnosticCode')} allocated={worker.get('allocatedBytes')} status={worker.get('success')}")
              for phase in metrics:
                  print(f"  {phase['Stage']:18} us={phase['ElapsedMicroseconds']} allocated={phase['AllocatedBytes']} work={phase['WorkUnits']} ok={phase['Success']}")
                  if any(phase[field] < 0 for field in ("ElapsedMicroseconds", "AllocatedBytes", "WorkUnits")):
                      raise SystemExit("Negative stage resource measurements.")
              if worker.get("success") and not required.issubset(phases):
                  raise SystemExit("Successful compilation omitted required stage telemetry.")
          # Lock in both measured 2,048-depth Query shapes. Before the
          # streaming CTE change this shape allocated >500 MB.
          if report["samples"] != 9 or report["failures"] != 0 or report["crashesOrTimeouts"] != 0:
              raise SystemExit("Nested derived/CTE/typed-CTE depth floor regressed.")
          for item in report["observations"]:
              worker = item.get("worker") or {}
              if not worker.get("success") or item["processExitCode"] != 0:
                  raise SystemExit("Nested Query probe must compile: "
                                   + str((item["shape"], item["depth"])))
              if item["depth"] == 2048 and (
                  not isinstance(worker.get("allocatedBytes"), int)
                  or worker["allocatedBytes"] > 120_000_000
              ):
                  raise SystemExit("Nested Query 2048 allocation exceeded 120 MB: "
                                   + str((item["shape"], worker.get("allocatedBytes"))))
          PY
      - name: Characterize alternating CTE/derived parser resource threshold
        run: >
          dotnet run -c Release --no-build
          --project backend/benchmarks/HsSqlAgent.SqlCore.Benchmarks --
          --depth-probe --dialects Postgres
          --shapes mixed-cte-derived,mixed-cte-derived-typed-schema --depths 128,512,2048
          --output artifacts/sqlcore-mixed-cte-derived-pr.json
      - name: Gate mixed CTE/derived streaming allocations and stages
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path("artifacts/sqlcore-mixed-cte-derived-pr.json")
          if not path.exists():
              raise SystemExit("Mixed CTE/derived profiling report missing")
          report = json.loads(path.read_text(encoding="utf-8"))
          print(f"Mixed CTE/derived: samples={report['samples']} failures={report['failures']} crashesOrTimeouts={report['crashesOrTimeouts']}")
          if report["samples"] != 6 or report["failures"] or report["crashesOrTimeouts"]:
              raise SystemExit("Mixed CTE/derived probe must compile at all three depths")
          required = {"Parsing", "Binding", "Normalization", "Validation", "Policy", "Rendering"}
          for item in report["observations"]:
              worker = item.get("worker") or {}
              phases = [p["Stage"] for p in worker.get("stageMetrics", []) if p["Success"]]
              print(f"  depth={item['depth']} success={worker.get('success')} code={worker.get('diagnosticCode')} phases={phases} bytes={worker.get('allocatedBytes')}")
              needed = required | ({"SchemaBinding", "SchemaType"}
                  if item["shape"] == "mixed-cte-derived-typed-schema" else set())
              if not worker.get("success") or item["processExitCode"] != 0 or not needed.issubset(phases):
                  raise SystemExit("Mixed CTE/derived compile or telemetry regressed: " + str(item["depth"]))
              if item["depth"] == 2048 and (
                  not isinstance(worker.get("allocatedBytes"), int)
                  or worker["allocatedBytes"] > 120_000_000
              ):
                  raise SystemExit("Mixed CTE/derived 2048 exceeded 120MB total allocated; streaming path regressed")
              for phase in worker.get("stageMetrics", []):
                  if phase["Stage"] == "Rendering" and item["depth"] == 2048 and (
                      phase["AllocatedBytes"] > 60_000_000
                  ):
                      raise SystemExit("Mixed CTE/derived 2048 rendering exceeded 60MB allocation")
          PY
      - name: Characterize nested SET branch stack and allocations (isolated, observational)
        run: >
          dotnet run -c Release --no-build
          --project backend/benchmarks/HsSqlAgent.SqlCore.Benchmarks --
          --depth-probe --dialects Postgres
          --shapes nested-set,nested-set-typed-schema --depths 128,512,2048
          --output artifacts/sqlcore-nested-set-pr.json
      - name: Print nested SET path diagnostics and phase budgets
        if: always()
        shell: bash
        run: |
          if test ! -f artifacts/sqlcore-nested-set-pr.json; then
            echo "Nested SET probe report missing." >&2
            exit 1
          fi
          python3 - <<'PY'
          import json
          with open("artifacts/sqlcore-nested-set-pr.json", encoding="utf-8") as source:
              report = json.load(source)
          print(f"Nested SET: samples={report['samples']} failures={report['failures']} crashOrTimeout={report['crashesOrTimeouts']}")
          if report["samples"] != 6 or report["failures"] != 0 or report["crashesOrTimeouts"] != 0:
              raise SystemExit("Nested SET regression: all six subprocess probes must compile safely.")
          required = {"Parsing", "Binding", "Normalization", "Validation", "Policy", "Rendering"}
          for item in report["observations"]:
              worker = item.get("worker") or {}
              print(f"{item['shape']:25} depth={item['depth']:4} success={worker.get('success')} code={worker.get('diagnosticCode')} allocated={worker.get('allocatedBytes')} exit={item['processExitCode']}")
              if not worker.get("success") or item["processExitCode"] != 0:
                  raise SystemExit("Nested SET worker must compile: "
                                   + str((item["shape"], item["depth"], worker.get("diagnosticCode"))))
              samples = worker.get("stageMetrics") or []
              stages = {stage["Stage"] for stage in samples if stage.get("Success")}
              expected = required | ({"SchemaBinding", "SchemaType"} if item["shape"] == "nested-set-typed-schema" else set())
              if not expected.issubset(stages):
                  raise SystemExit("Nested SET compilation omitted required phase metrics.")
              for phase in samples:
                  print(f"  {phase['Stage']:18} allocated={phase['AllocatedBytes']} elapsedUs={phase['ElapsedMicroseconds']} work={phase['WorkUnits']} ok={phase['Success']}")
                  if any(phase[key] < 0 for key in ("AllocatedBytes", "ElapsedMicroseconds", "WorkUnits")):
                      raise SystemExit("Negative nested SET phase resource measurement.")
              if item["depth"] == 2048 and (
                  not isinstance(worker.get("allocatedBytes"), int)
                  or worker["allocatedBytes"] > 120_000_000
              ):
                  raise SystemExit("Nested SET 2048 allocation exceeded 120 MB: "
                                   + str((item["shape"], worker.get("allocatedBytes"))))
          PY
      - name: Verify iterative nested SET parsing on 256 KiB stacks
        run: >
          dotnet run -c Release --no-build
          --project backend/benchmarks/HsSqlAgent.SqlCore.Benchmarks --
          --depth-probe --dialects Postgres
          --shapes nested-set,nested-set-typed-schema
          --depths 512,2048 --stack-bytes 262144
          --output artifacts/sqlcore-set-small-stack-pr.json
      - name: Gate 256 KiB nested SET successful compilation and phases
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          with open("artifacts/sqlcore-set-small-stack-pr.json", encoding="utf-8") as src:
              report = json.load(src)
          print(f"SET small stack: samples={report['samples']} failures={report['failures']} crashesOrTimeouts={report['crashesOrTimeouts']}")
          if report["samples"] != 4 or report["failures"] or report["crashesOrTimeouts"]:
              raise SystemExit("Iterative nested SET on 256 KiB must compile successfully, not merely fail closed.")
          for item in report["observations"]:
              worker = item.get("worker") or {}
              stages = {stage["Stage"] for stage in worker.get("stageMetrics", []) if stage.get("Success")}
              required = {"Parsing", "Binding", "Normalization", "Validation", "Policy", "Rendering"}
              if item["shape"] == "nested-set-typed-schema":
                  required |= {"SchemaBinding", "SchemaType"}
              if (not worker.get("success") or item["processExitCode"] != 0
                      or not required.issubset(stages)):
                  raise SystemExit("SET stack regression: " + str(
                      (item["shape"], item["depth"], worker.get("diagnosticCode"), stages)))
              print(f"  {item['shape']:25} depth={item['depth']} allocated={worker.get('allocatedBytes')} stages={len(stages)}")
          PY
      - name: Verify heap CTE parsing and typed proof on 256 KiB stacks
        run: >
          dotnet run -c Release --no-build
          --project backend/benchmarks/HsSqlAgent.SqlCore.Benchmarks --
          --depth-probe --dialects Postgres
          --shapes nested-cte,nested-cte-typed-schema
          --depths 512,2048 --stack-bytes 262144
          --output artifacts/sqlcore-cte-small-stack-pr.json
      - name: Gate 256 KiB nested CTE successful compilation
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          with open("artifacts/sqlcore-cte-small-stack-pr.json", encoding="utf-8") as src:
              report = json.load(src)
          print(f"CTE small stack: samples={report['samples']} failures={report['failures']} crashesOrTimeouts={report['crashesOrTimeouts']}")
          if report["samples"] != 4 or report["failures"] or report["crashesOrTimeouts"]:
              raise SystemExit("Nested CTE must compile successfully on a 256 KiB stack.")
          for item in report["observations"]:
              worker = item.get("worker") or {}
              stages = {sample["Stage"] for sample in worker.get("stageMetrics", []) if sample.get("Success")}
              required = {"Parsing", "Binding", "Normalization", "Validation", "Policy", "Rendering"}
              if item["shape"] == "nested-cte-typed-schema":
                  required |= {"SchemaBinding", "SchemaType"}
              if not worker.get("success") or item["processExitCode"] != 0 or not required.issubset(stages):
                  raise SystemExit("CTE small stack did not succeed: " + str(
                      (item["shape"], item["depth"], worker.get("diagnosticCode"), worker.get("error"), stages)))
              print(f"  {item['shape']:25} depth={item['depth']} bytes={worker['allocatedBytes']} stages={len(stages)}")
          PY
      - name: Require alternating CTE-derived full compilation on 256 KiB stacks
        run: >
          dotnet run -c Release --no-build
          --project backend/benchmarks/HsSqlAgent.SqlCore.Benchmarks --
          --depth-probe --dialects Postgres
          --shapes mixed-cte-derived,mixed-cte-derived-typed-schema --depths 512,2048
          --stack-bytes 262144
          --output artifacts/sqlcore-mixed-cte-derived-small-stack-pr.json
      - name: Gate mixed CTE-derived stack success and phase completeness
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          with open("artifacts/sqlcore-mixed-cte-derived-small-stack-pr.json", encoding="utf-8") as source:
              report = json.load(source)
          print(f"Mixed CTE/derived 256 KiB: samples={report['samples']} failures={report['failures']} crashesOrTimeouts={report['crashesOrTimeouts']}")
          if report["samples"] != 4 or report["failures"] or report["crashesOrTimeouts"]:
              raise SystemExit("Mixed CTE/derived must fully compile on 256 KiB, not merely fail closed.")
          expected = {"Parsing", "Binding", "Normalization", "Validation", "Policy", "Rendering"}
          for item in report["observations"]:
              worker = item.get("worker") or {}
              stages = {stage["Stage"] for stage in worker.get("stageMetrics", []) if stage.get("Success")}
              needed = expected | ({"SchemaBinding", "SchemaType"}
                  if item["shape"] == "mixed-cte-derived-typed-schema" else set())
              if not worker.get("success") or item["processExitCode"] != 0 or not needed.issubset(stages):
                  raise SystemExit("Mixed Query stack success/telemetry regressed: " + str(
                      (item["depth"], worker.get("diagnosticCode"), worker.get("error"), stages)))
              if item["depth"] == 2048 and (
                  not isinstance(worker.get("allocatedBytes"), int)
                  or worker["allocatedBytes"] > 120_000_000
              ):
                  raise SystemExit("Mixed CTE/derived 2048 depth exceeds the existing 120 MB allocation ceiling")
              print(f"  depth={item['depth']} bytes={worker['allocatedBytes']} stages={len(stages)}")
          PY
      - name: Verify primary FROM LATERAL proof on 256 KiB stacks
        run: >
          dotnet run -c Release --no-build
          --project backend/benchmarks/HsSqlAgent.SqlCore.Benchmarks --
          --depth-probe --dialects Postgres
          --shapes nested-lateral-derived,nested-lateral-derived-typed-schema
          --depths 512,2048 --stack-bytes 262144
          --output artifacts/sqlcore-lateral-small-stack-pr.json
      - name: Gate LATERAL rendering and scoped type proof
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          with open("artifacts/sqlcore-lateral-small-stack-pr.json", encoding="utf-8") as source:
              report = json.load(source)
          print(f"LATERAL 256 KiB: samples={report['samples']} failures={report['failures']} crashesOrTimeouts={report['crashesOrTimeouts']}")
          if report["samples"] != 4 or report["failures"] or report["crashesOrTimeouts"]:
              raise SystemExit("Primary LATERAL source must compile at 512/2048 on 256 KiB.")
          required = {"Parsing", "Binding", "Normalization", "Validation", "Policy", "Rendering"}
          for item in report["observations"]:
              worker = item.get("worker") or {}
              present = {m["Stage"] for m in worker.get("stageMetrics", []) if m.get("Success")}
              expected = required | ({"SchemaBinding", "SchemaType"}
                  if item["shape"] == "nested-lateral-derived-typed-schema" else set())
              if not worker.get("success") or item["processExitCode"] != 0 or not expected.issubset(present):
                  raise SystemExit("LATERAL source stack/type regression: " + str(
                      (item["shape"], item["depth"], worker.get("diagnosticCode"), worker.get("error"), present)))
              for stage in worker.get("stageMetrics", []):
                  if any(stage[field] < 0 for field in ("ElapsedMicroseconds", "AllocatedBytes", "WorkUnits")):
                      raise SystemExit("Negative LATERAL phase telemetry.")
              if item["depth"] == 2048:
                  if not isinstance(worker.get("allocatedBytes"), int) or worker["allocatedBytes"] > 120_000_000:
                      raise SystemExit("2,048-level LATERAL total allocation exceeded 120 MB.")
                  rendering = [p for p in worker.get("stageMetrics", []) if p["Stage"] == "Rendering"]
                  if len(rendering) != 1 or rendering[0]["AllocatedBytes"] > 60_000_000:
                      raise SystemExit("2,048-level LATERAL streaming allocation exceeded 60 MB.")
              print(f"  {item['shape']:34} depth={item['depth']} allocated={worker.get('allocatedBytes')} stages={len(present)}")
          PY
      - name: Verify correlated JOIN LATERAL and WHERE EXISTS scope on 256 KiB stacks
        run: >
          dotnet run -c Release --no-build
          --project backend/benchmarks/HsSqlAgent.SqlCore.Benchmarks --
          --depth-probe --dialects Postgres
          --shapes nested-joined-lateral,nested-joined-lateral-typed-schema,nested-correlated-exists,nested-correlated-exists-typed-schema
          --depths 128,512,2048 --stack-bytes 262144
          --output artifacts/sqlcore-correlated-small-stack-pr.json
      - name: Gate correlated mixed Query graphs without crashes or silent validation bypass
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path("artifacts/sqlcore-correlated-small-stack-pr.json")
          with path.open(encoding="utf-8") as source:
              report = json.load(source)
          if (report["samples"] != 12 or report["crashesOrTimeouts"] or
              report["failures"] or report["resourceRejections"]):
              raise SystemExit("Correlated Query/Expr/Source must compile all 12 cases on 256 KiB: " + str(
                  (report["samples"], report["failures"], report["resourceRejections"], report["crashesOrTimeouts"])))
          full = {"Parsing", "Binding", "Normalization", "Validation", "Policy", "Rendering"}
          succeeded = rejected = 0
          for item in report["observations"]:
              worker = item.get("worker") or {}
              typed = item["shape"].endswith("-typed-schema")
              stages = {s["Stage"] for s in worker.get("stageMetrics", []) if s.get("Success")}
              if worker.get("success"):
                  succeeded += 1
