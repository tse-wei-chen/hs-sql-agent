name: Tests

on:
  push:
    branches: [main]
  pull_request: {}
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  common-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Run Common.Test with real test and coverage evidence
        run: >
          dotnet test --project backend/src/UnitTest/Common.Test/Common.Test.csproj
          --report-xunit-trx --report-xunit-trx-filename run.trx
          --coverlet --coverlet-output-format cobertura
          --results-directory artifacts/test-evidence/common-test
      - name: Require nonempty xUnit TRX and production-code coverage
        run: dotnet run --project backend/tools/HsSqlAgent.TestGovernance -- verify --directory artifacts/test-evidence/common-test --suite Common.Test
      - name: Upload Common.Test TRX and instrumented source coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence-common-test
          path: artifacts/test-evidence/common-test/
          if-no-files-found: warn

  infrastructure-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Enforce Python-free tracked files and GitHub Actions
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$(git ls-files -- '*.py')" ]; then
            echo "Python source files are not allowed in the repository:" >&2
            git ls-files -- '*.py' >&2
            exit 1
          fi
          if grep -RnE '[p]ython[0-9]*[[:space:]]|[<]<.PY.' .github/workflows; then
            echo "Inline Python or Python interpreter invocations are not allowed in CI." >&2
            exit 1
          fi
      - name: Audit test project ownership and evidence contracts
        run: |
          dotnet run --project backend/tools/HsSqlAgent.TestGovernance -- audit --root .
      - name: Verify 3.1.0 publication blocker while issue 575 is open
        run: bash .github/scripts/test-release-security-gate.sh
      - name: Run Infrastructure.Test with real test and coverage evidence
        run: >
          dotnet test --project backend/src/UnitTest/Infrastructure.Test/Infrastructure.Test.csproj
          --report-xunit-trx --report-xunit-trx-filename run.trx
          --coverlet --coverlet-output-format cobertura
          --results-directory artifacts/test-evidence/infrastructure-test
      - name: Require nonempty xUnit TRX and production-code coverage
        run: dotnet run --project backend/tools/HsSqlAgent.TestGovernance -- verify --directory artifacts/test-evidence/infrastructure-test --suite Infrastructure.Test
      - name: Upload Infrastructure.Test TRX and instrumented source coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence-infrastructure-test
          path: artifacts/test-evidence/infrastructure-test/
          if-no-files-found: warn

  auth-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Run Auth.Test with real test and coverage evidence
        run: >
          dotnet test --project backend/src/UnitTest/Auth.Test/Auth.Test.csproj
          --report-xunit-trx --report-xunit-trx-filename run.trx
          --coverlet --coverlet-output-format cobertura
          --results-directory artifacts/test-evidence/auth-test
      - name: Require nonempty xUnit TRX and production-code coverage
        run: dotnet run --project backend/tools/HsSqlAgent.TestGovernance -- verify --directory artifacts/test-evidence/auth-test --suite Auth.Test
      - name: Upload Auth.Test TRX and instrumented source coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence-auth-test
          path: artifacts/test-evidence/auth-test/
          if-no-files-found: warn

  admin-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Run Admin.Test with real test and coverage evidence
        run: >
          dotnet test --project backend/src/UnitTest/Admin.Test/Admin.Test.csproj
          --report-xunit-trx --report-xunit-trx-filename run.trx
          --coverlet --coverlet-output-format cobertura
          --results-directory artifacts/test-evidence/admin-test
      - name: Require nonempty xUnit TRX and production-code coverage
        run: dotnet run --project backend/tools/HsSqlAgent.TestGovernance -- verify --directory artifacts/test-evidence/admin-test --suite Admin.Test
      - name: Upload Admin.Test TRX and instrumented source coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence-admin-test
          path: artifacts/test-evidence/admin-test/
          if-no-files-found: warn

  server-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Guard domain-organized test layout
        run: |
          dotnet run --project backend/tools/HsSqlAgent.TestGovernance -- layout --root .
      - name: Verify released v2.0.6 Admin Store migration baseline is immutable
        shell: bash
        run: bash .github/scripts/verify-v2-admin-migration-baseline.sh
      - name: Run server unit tests (excluding explicit Redis integration suite)
        run: dotnet test --project backend/src/UnitTest/HsSqlAgent.Server.Test/HsSqlAgent.Server.Test.csproj --filter 'FullyQualifiedName!~RedisDmlApprovalIntegrationTests&FullyQualifiedName!~SqlCoreSqlServerDdlHostLiveTests&FullyQualifiedName!~SqlServerMergeMatchedDeleteApprovalLiveTests&FullyQualifiedName!~SqlServerMergeMatchedUpdateApprovalLiveTests&FullyQualifiedName!~SqlServerMergeNotMatchedInsertApprovalLiveTests&FullyQualifiedName!~FirebirdDdlLiveTests&FullyQualifiedName!~MySqlDdlLiveTests&FullyQualifiedName!~OracleDdlLiveTests&FullyQualifiedName!~QueryNativeFunctionLiveTests'

  redis-approval-integration:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Verify real Redis and run cross-instance approval races
        run: |
          test -n "${HS_SQL_AGENT_REDIS_INTEGRATION_CONNECTION:?Redis service is required}"
          dotnet test --project backend/src/UnitTest/HsSqlAgent.Server.Test/HsSqlAgent.Server.Test.csproj --filter 'FullyQualifiedName~RedisDmlApprovalIntegrationTests'
        env:
          HS_SQL_AGENT_REDIS_INTEGRATION_CONNECTION: "localhost:6379,abortConnect=true,connectTimeout=5000"

  sqlagent-capability-stack:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Gate six-provider 256 KiB capability and DML stacks (Debug)
        run: >
          dotnet run -c Debug
          --project backend/benchmarks/HsSqlAgent.SqlCore.Benchmarks --
          --capability-stack-probe --output artifacts/sqlcore-capability-stack-debug.json
      - name: Gate six-provider 256 KiB capability and DML stacks (Release)
        run: >
          dotnet run -c Release
          --project backend/benchmarks/HsSqlAgent.SqlCore.Benchmarks --
          --capability-stack-probe --output artifacts/sqlcore-capability-stack-release.json
      - name: Upload isolated stack evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sqlcore-capability-stack-evidence
          path: artifacts/sqlcore-capability-stack-*.json
          if-no-files-found: warn

  sqlagent-syntax-matrix:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Gate observed six-provider SQL coverage ledger (3.1)
        shell: bash
        run: |
          dotnet run --project backend/tools/HsSqlAgent.TestGovernance -- sql-corpus \
            --manifest backend/src/UnitTest/SqlAgent.Test/SyntaxCorpus/sqlcore-coverage-manifest.json \
            --output artifacts/sqlcore-coverage-ledger.json
      - name: Upload observed SQL coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sqlcore-observed-coverage-ledger
          path: artifacts/sqlcore-coverage-ledger.json
          if-no-files-found: warn
      - name: Run generated SQL grammar matrices
        run: dotnet test --project backend/src/UnitTest/SqlAgent.Test/SqlAgent.Test.csproj --filter '(FullyQualifiedName~GrammarMatrixTests|FullyQualifiedName~MutationMatrixTests|FullyQualifiedName~NegativeBindingPolicyMatrixTests|FullyQualifiedName~NegativeTargetCapabilityMatrixTests|FullyQualifiedName~NegativeTablePolicyMatrixTests|FullyQualifiedName~SqlGrammarBombardmentCoverageTests)'
      - name: Validate SQL compiler benchmark harness (smoke only)
        run: dotnet run -c Release --project backend/benchmarks/HsSqlAgent.SqlCore.Benchmarks -- --smoke
      - name: Probe SQL expression nesting in isolated subprocesses (smoke only)
        run: dotnet run -c Release --no-build --project backend/benchmarks/HsSqlAgent.SqlCore.Benchmarks -- --depth-probe --smoke
      - name: Record all-dialect deep SQL behavior (isolated, observational)
        run: >
          dotnet run -c Release --no-build
          --project backend/benchmarks/HsSqlAgent.SqlCore.Benchmarks --
          --depth-probe --dialects Postgres,MySQL,Sqlite,MsSqlServer,Oracle,Firebird
          --depths 128,512,2048
          --output artifacts/sqlcore-depth-pr.json
      - name: Print high-depth SQL allocation and crash evidence
        if: always()
        shell: bash
        run: |
          if test ! -f artifacts/sqlcore-depth-pr.json; then
            echo "Depth report missing; preceding step failed." >&2
            exit 1
          fi
          dotnet run --no-build --project backend/tools/HsSqlAgent.TestGovernance -- depth-probe --profile depth --file artifacts/sqlcore-depth-pr.json
      - name: Characterize mixed Expr/EXISTS Query nesting (isolated, observational)
        run: >
          dotnet run -c Release --no-build
          --project backend/benchmarks/HsSqlAgent.SqlCore.Benchmarks --
          --depth-probe --dialects Postgres,Oracle
          --shapes mixed-query-graph --depths 128,512,2048
          --output artifacts/sqlcore-mixed-depth-pr.json
      - name: Print mixed Query depth outcomes
        if: always()
        shell: bash
        run: |
          if test ! -f artifacts/sqlcore-mixed-depth-pr.json; then
            echo "Mixed Query depth report missing; preceding step failed." >&2
            exit 1
          fi
          dotnet run --no-build --project backend/tools/HsSqlAgent.TestGovernance -- depth-probe --profile mixed-depth --file artifacts/sqlcore-mixed-depth-pr.json
      - name: Profile nested derived and CTE query phases (isolated, observational)
        run: >
          dotnet run -c Release --no-build
          --project backend/benchmarks/HsSqlAgent.SqlCore.Benchmarks --
          --depth-probe --dialects Postgres
          --shapes nested-derived-source,nested-cte,nested-cte-typed-schema --depths 128,512,2048
          --output artifacts/sqlcore-query-phases-pr.json
      - name: Inspect per-stage query profiling and resource exits
        if: always()
        shell: bash
        run: |
          if test ! -f artifacts/sqlcore-query-phases-pr.json; then
            echo "Nested Query phase report missing." >&2
            exit 1
          fi
          dotnet run --no-build --project backend/tools/HsSqlAgent.TestGovernance -- depth-probe --profile query-phases --file artifacts/sqlcore-query-phases-pr.json
      - name: Characterize alternating CTE/derived parser resource threshold
        run: >
          dotnet run -c Release --no-build
          --project backend/benchmarks/HsSqlAgent.SqlCore.Benchmarks --
          --depth-probe --dialects Postgres
          --shapes mixed-cte-derived,mixed-cte-derived-typed-schema --depths 128,512,2048
          --output artifacts/sqlcore-mixed-cte-derived-pr.json
      - name: Gate mixed CTE/derived streaming allocations and stages
        if: always()
        shell: bash
        run: |
          dotnet run --no-build --project backend/tools/HsSqlAgent.TestGovernance -- depth-probe --profile mixed-cte-derived --file artifacts/sqlcore-mixed-cte-derived-pr.json
      - name: Characterize nested SET branch stack and allocations (isolated, observational)
        run: >
          dotnet run -c Release --no-build
          --project backend/benchmarks/HsSqlAgent.SqlCore.Benchmarks --
          --depth-probe --dialects Postgres
          --shapes nested-set,nested-set-typed-schema --depths 128,512,2048
          --output artifacts/sqlcore-nested-set-pr.json
      - name: Print nested SET path diagnostics and phase budgets
        if: always()
        shell: bash
        run: |
          if test ! -f artifacts/sqlcore-nested-set-pr.json; then
            echo "Nested SET probe report missing." >&2
            exit 1
          fi
          dotnet run --no-build --project backend/tools/HsSqlAgent.TestGovernance -- depth-probe --profile nested-set --file artifacts/sqlcore-nested-set-pr.json
      - name: Verify iterative nested SET parsing on 256 KiB stacks
        run: >
          dotnet run -c Release --no-build
          --project backend/benchmarks/HsSqlAgent.SqlCore.Benchmarks --
          --depth-probe --dialects Postgres
          --shapes nested-set,nested-set-typed-schema
          --depths 512,2048 --stack-bytes 262144
          --output artifacts/sqlcore-set-small-stack-pr.json
      - name: Gate 256 KiB nested SET successful compilation and phases
        shell: bash
        run: |
          dotnet run --no-build --project backend/tools/HsSqlAgent.TestGovernance -- depth-probe --profile set-small --file artifacts/sqlcore-set-small-stack-pr.json
      - name: Verify heap CTE parsing and typed proof on 256 KiB stacks
        run: >
          dotnet run -c Release --no-build
          --project backend/benchmarks/HsSqlAgent.SqlCore.Benchmarks --
          --depth-probe --dialects Postgres
          --shapes nested-cte,nested-cte-typed-schema
          --depths 512,2048 --stack-bytes 262144
          --output artifacts/sqlcore-cte-small-stack-pr.json
      - name: Gate 256 KiB nested CTE successful compilation
        shell: bash
        run: |
          dotnet run --no-build --project backend/tools/HsSqlAgent.TestGovernance -- depth-probe --profile cte-small --file artifacts/sqlcore-cte-small-stack-pr.json
      - name: Require alternating CTE-derived full compilation on 256 KiB stacks
        run: >
          dotnet run -c Release --no-build
          --project backend/benchmarks/HsSqlAgent.SqlCore.Benchmarks --
          --depth-probe --dialects Postgres
          --shapes mixed-cte-derived,mixed-cte-derived-typed-schema --depths 512,2048
          --stack-bytes 262144
          --output artifacts/sqlcore-mixed-cte-derived-small-stack-pr.json
      - name: Gate mixed CTE-derived stack success and phase completeness
        shell: bash
        run: |
          dotnet run --no-build --project backend/tools/HsSqlAgent.TestGovernance -- depth-probe --profile mixed-small --file artifacts/sqlcore-mixed-cte-derived-small-stack-pr.json
      - name: Verify primary FROM LATERAL proof on 256 KiB stacks
        run: >
          dotnet run -c Release --no-build
          --project backend/benchmarks/HsSqlAgent.SqlCore.Benchmarks --
          --depth-probe --dialects Postgres
          --shapes nested-lateral-derived,nested-lateral-derived-typed-schema
          --depths 512,2048 --stack-bytes 262144
          --output artifacts/sqlcore-lateral-small-stack-pr.json
      - name: Gate LATERAL rendering and scoped type proof
        shell: bash
        run: |
          dotnet run --no-build --project backend/tools/HsSqlAgent.TestGovernance -- depth-probe --profile lateral --file artifacts/sqlcore-lateral-small-stack-pr.json
      - name: Verify correlated JOIN LATERAL and WHERE EXISTS scope on 256 KiB stacks
        run: >
          dotnet run -c Release --no-build
          --project backend/benchmarks/HsSqlAgent.SqlCore.Benchmarks --
          --depth-probe --dialects Postgres
          --shapes nested-joined-lateral,nested-joined-lateral-typed-schema,nested-correlated-exists,nested-correlated-exists-typed-schema
          --depths 128,512,2048 --stack-bytes 262144
          --output artifacts/sqlcore-correlated-small-stack-pr.json
      - name: Gate correlated mixed Query graphs without crashes or silent validation bypass
        shell: bash
        run: |
          dotnet run --no-build --project backend/tools/HsSqlAgent.TestGovernance -- depth-probe --profile correlated --file artifacts/sqlcore-correlated-small-stack-pr.json
      - name: Verify prefixed second JOIN LATERAL correlation on 256 KiB stacks
        run: >
          dotnet run -c Release --no-build
          --project backend/benchmarks/HsSqlAgent.SqlCore.Benchmarks --
          --depth-probe --dialects Postgres
          --shapes nested-prefixed-joined-lateral,nested-prefixed-joined-lateral-typed-schema
          --depths 128,512,2048 --stack-bytes 262144
          --output artifacts/sqlcore-prefixed-join-lateral-pr.json
      - name: Gate second JOIN LATERAL full compilation and typed scope
        shell: bash
        run: |
          dotnet run --no-build --project backend/tools/HsSqlAgent.TestGovernance -- depth-probe --profile prefixed --file artifacts/sqlcore-prefixed-join-lateral-pr.json
      - name: Verify two dependent JOIN LATERALs on 256 KiB stacks
        run: >
          dotnet run -c Release --no-build
          --project backend/benchmarks/HsSqlAgent.SqlCore.Benchmarks --
          --depth-probe --dialects Postgres
          --shapes nested-double-joined-lateral,nested-double-joined-lateral-typed-schema
          --depths 128,512,2048 --stack-bytes 262144
          --output artifacts/sqlcore-double-joined-lateral-pr.json
      - name: Gate dependent JOIN LATERAL scope and real deep compilation
        shell: bash
        run: |
          dotnet run --no-build --project backend/tools/HsSqlAgent.TestGovernance -- depth-probe --profile double --file artifacts/sqlcore-double-joined-lateral-pr.json
      - name: Require three dependent JOIN LATERALs on 256 KiB stacks
        run: >
          dotnet run -c Release --no-build
          --project backend/benchmarks/HsSqlAgent.SqlCore.Benchmarks --
          --depth-probe --dialects Postgres
          --shapes nested-triple-joined-lateral,nested-triple-joined-lateral-typed-schema
          --depths 128,512,2048 --stack-bytes 262144
          --output artifacts/sqlcore-triple-joined-lateral-pr.json
      - name: Gate sequential JOIN prefix heap scope and stages
        shell: bash
        run: |
          dotnet run --no-build --project backend/tools/HsSqlAgent.TestGovernance -- depth-probe --profile triple --file artifacts/sqlcore-triple-joined-lateral-pr.json
      - name: Probe two independently deep LATERAL sibling Queries on 256 KiB stacks
        run: >
          dotnet run -c Release --no-build
          --project backend/benchmarks/HsSqlAgent.SqlCore.Benchmarks --
          --depth-probe --dialects Postgres
          --shapes two-deep-sibling-lateral,two-deep-sibling-lateral-typed-schema
          --depths 128,512,2048 --stack-bytes 262144
          --output artifacts/sqlcore-two-deep-sibling-lateral-pr.json
      - name: Gate two deep LATERAL sibling proofs and resource isolation
        shell: bash
        run: |
          dotnet run --no-build --project backend/tools/HsSqlAgent.TestGovernance -- depth-probe --profile siblings --file artifacts/sqlcore-two-deep-sibling-lateral-pr.json
      - name: Verify mixed Source and WHERE EXISTS lateral comb on 256 KiB
        run: >
          dotnet run -c Release --no-build
          --project backend/benchmarks/HsSqlAgent.SqlCore.Benchmarks --
          --depth-probe --dialects Postgres
          --shapes lateral-exists-comb-siblings,lateral-exists-comb-siblings-typed-schema
          --depths 128,512,2048 --stack-bytes 262144
          --output artifacts/sqlcore-lateral-exists-comb-pr.json
      - name: Gate mixed Query Source Expr comb branches and typed safety
        shell: bash
        run: |
          dotnet run --no-build --project backend/tools/HsSqlAgent.TestGovernance -- depth-probe --profile comb --file artifacts/sqlcore-lateral-exists-comb-pr.json
      - name: Verify public Query Facts inspection on 256 KiB stacks
        run: >
          dotnet run -c Release --no-build
          --project backend/benchmarks/HsSqlAgent.SqlCore.Benchmarks --
          --depth-probe --dialects Postgres
          --shapes facts-joined-lateral,facts-joined-lateral-typed-schema
          --depths 128,512,2048 --stack-bytes 262144
          --output artifacts/sqlcore-facts-small-stack-pr.json
      - name: Gate Inspection phase work accounting and deep Query Facts
        shell: bash
        run: |
          dotnet run --no-build --project backend/tools/HsSqlAgent.TestGovernance -- depth-probe --profile facts --file artifacts/sqlcore-facts-small-stack-pr.json
      - name: Verify correlated IN Query heap continuation on 256 KiB stacks
        run: >
          dotnet run -c Release --no-build
          --project backend/benchmarks/HsSqlAgent.SqlCore.Benchmarks --
          --depth-probe --dialects Postgres
          --shapes nested-correlated-in,nested-correlated-in-typed-schema
          --depths 128,512,2048 --stack-bytes 262144
          --output artifacts/sqlcore-in-small-stack-pr.json
      - name: Gate correlated IN actual compilation, typed proof and allocations
        shell: bash
        run: |
          dotnet run --no-build --project backend/tools/HsSqlAgent.TestGovernance -- depth-probe --profile correlated-in --file artifacts/sqlcore-in-small-stack-pr.json
      - name: Diagnose projection ScalarSubquery and CASE Query crossings on small stacks
        run: >
          dotnet run -c Release --no-build
          --project backend/benchmarks/HsSqlAgent.SqlCore.Benchmarks --
          --depth-probe --dialects Postgres
          --shapes nested-scalar-subquery,nested-scalar-subquery-typed-schema,nested-case-scalar,nested-case-scalar-typed-schema
          --depths 128,512,2048 --stack-bytes 262144
          --output artifacts/sqlcore-scalar-case-small-stack-pr.json
      - name: Report projection Query crossings, preserving refusal versus success
        shell: bash
        run: |
          dotnet run --no-build --project backend/tools/HsSqlAgent.TestGovernance -- depth-probe --profile projection --file artifacts/sqlcore-scalar-case-small-stack-pr.json
      - name: Require six-provider deep paging and exact negative grammar on 256 KiB
        run: >
          dotnet run -c Release --no-build
          --project backend/benchmarks/HsSqlAgent.SqlCore.Benchmarks --
          --depth-probe --dialects Postgres,MySQL,Sqlite,MsSqlServer,Oracle,Firebird
          --shapes nested-paging-typed-schema,invalid-nested-paging
          --depths 128,512,2048 --stack-bytes 262144
          --output artifacts/sqlcore-paging-small-stack-pr.json
      - name: Gate complete paging corpus, typed stages and first syntax error
        run: |
          dotnet run --no-build --project backend/tools/HsSqlAgent.TestGovernance -- depth-probe --profile paging --file artifacts/sqlcore-paging-small-stack-pr.json
      - name: Measure constrained-stack SQL compilation (observational)
        run: >
          dotnet run -c Release --no-build
          --project backend/benchmarks/HsSqlAgent.SqlCore.Benchmarks --
          --depth-probe --dialects Postgres,MsSqlServer,Oracle,Firebird
          --shapes nested-scalar-subquery,left-deep-and
          --depths 512,2048 --stack-bytes 262144
          --output artifacts/sqlcore-small-stack-pr.json
      - name: Summarize constrained-stack resource diagnostics
        run: |
          dotnet run --no-build --project backend/tools/HsSqlAgent.TestGovernance -- depth-probe --profile small-stack --file artifacts/sqlcore-small-stack-pr.json
      - name: Upload isolated SQL nesting report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sqlcore-depth-pr
          path: |
            artifacts/sqlcore-depth-pr.json
            artifacts/sqlcore-small-stack-pr.json
            artifacts/sqlcore-mixed-depth-pr.json
            artifacts/sqlcore-query-phases-pr.json
            artifacts/sqlcore-nested-set-pr.json
            artifacts/sqlcore-set-small-stack-pr.json
            artifacts/sqlcore-mixed-cte-derived-pr.json
            artifacts/sqlcore-mixed-cte-derived-small-stack-pr.json
            artifacts/sqlcore-lateral-small-stack-pr.json
            artifacts/sqlcore-cte-small-stack-pr.json
            artifacts/sqlcore-correlated-small-stack-pr.json
            artifacts/sqlcore-prefixed-join-lateral-pr.json
            artifacts/sqlcore-double-joined-lateral-pr.json
            artifacts/sqlcore-triple-joined-lateral-pr.json
            artifacts/sqlcore-two-deep-sibling-lateral-pr.json
            artifacts/sqlcore-lateral-exists-comb-pr.json
            artifacts/sqlcore-facts-small-stack-pr.json
            artifacts/sqlcore-in-small-stack-pr.json
            artifacts/sqlcore-scalar-case-small-stack-pr.json
            artifacts/sqlcore-paging-small-stack-pr.json
          if-no-files-found: warn

  sqlagent-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
