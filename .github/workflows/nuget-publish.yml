name: Publish NuGet

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version_suffix:
        description: "NuGet version suffix (e.g. beta, rc)"
        required: false
        default: ""

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Pack
        run: |
          if [ -n "${{ github.event.inputs.version_suffix }}" ]; then
            dotnet pack -c Release --version-suffix "${{ github.event.inputs.version_suffix }}" -o ./nupkg
          else
            dotnet pack -c Release -o ./nupkg
          fi
        working-directory: backend/src/Modules/HsSqlAgent.Server

      - name: Push to NuGet.org
        run: |
          dotnet nuget push ./nupkg/*.nupkg \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
