name: Publish NuGet

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version_suffix:
        description: "NuGet version suffix (e.g. beta, rc)"
        required: false
        default: ""

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Pack all public packages
        shell: bash
        run: |
          set -euo pipefail
          projects=(
            backend/src/Modules/HsSqlAgent.SqlCore/HsSqlAgent.SqlCore.fsproj
            backend/src/Modules/HsSqlAgent.Approvals.Abstractions/HsSqlAgent.Approvals.Abstractions.csproj
            backend/src/Modules/HsSqlAgent.Provider.Abstractions/HsSqlAgent.Provider.Abstractions.csproj
            backend/src/Modules/HsSqlAgent.Provider.PostgreSql/HsSqlAgent.Provider.PostgreSql.csproj
            backend/src/Modules/HsSqlAgent.Provider.MySql/HsSqlAgent.Provider.MySql.csproj
            backend/src/Modules/HsSqlAgent.Provider.Sqlite/HsSqlAgent.Provider.Sqlite.csproj
            backend/src/Modules/HsSqlAgent.Provider.SqlServer/HsSqlAgent.Provider.SqlServer.csproj
            backend/src/Modules/HsSqlAgent.Provider.Oracle/HsSqlAgent.Provider.Oracle.csproj
            backend/src/Modules/HsSqlAgent.Provider.Firebird/HsSqlAgent.Provider.Firebird.csproj
            backend/src/Modules/HsSqlAgent.Server/HsSqlAgent.Server.csproj
          )
          if [ -n "${{ github.event.inputs.version_suffix }}" ]; then
            pack_args=(--version-suffix "${{ github.event.inputs.version_suffix }}")
          else
            pack_args=()
          fi
          for project in "${projects[@]}"; do
            dotnet pack "$project" -c Release "${pack_args[@]}" -o "${{ github.workspace }}/nupkg"
          done

      - name: Smoke test packed Server package
        shell: bash
        run: bash .github/scripts/nuget-consumer-smoke.sh "${{ github.workspace }}/nupkg"

      - name: Log in to NuGet.org
        id: nuget_login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet.org
        run: |
          dotnet nuget push "${{ github.workspace }}/nupkg/*.nupkg" \
            --api-key "${{ steps.nuget_login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate