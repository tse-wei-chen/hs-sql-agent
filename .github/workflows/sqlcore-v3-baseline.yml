name: SqlCore v3 U0 compatibility baseline

on:
  pull_request:
    branches: [develop]
    paths:
      - 'backend/src/Modules/HsSqlAgent.SqlCore/**'
      - 'backend/src/UnitTest/SqlAgent.Test/Services/SqlCore/**'
      - 'backend/tools/HsSqlAgent.SqlCore.Benchmarks/**'
      - '.github/workflows/sqlcore-v3-baseline.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sqlcore-v3-u0-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  v3-contract-and-abi:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v4
        with:
          path: candidate
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
      - name: Checkout exact develop base SHA
        uses: actions/checkout@v4
        with:
          path: baseline
          ref: ${{ github.event.pull_request.base.sha || 'develop' }}
          submodules: recursive
      - name: Checkout immutable released v3.1.0 tag
        uses: actions/checkout@v4
        with:
          path: released
          ref: v3.1.0
          fetch-depth: 1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Record commit identities and pin the SAME baseline harness
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          git -C candidate rev-parse HEAD | tee artifacts/v3-candidate-sha.txt
          git -C baseline rev-parse HEAD | tee artifacts/v3-base-sha.txt
          git -C released rev-parse HEAD | tee artifacts/v3-published-tag-sha.txt
          if [ "$(cat artifacts/v3-published-tag-sha.txt)" != "c077f5703f2c0c8e6446a6e6017f3d375523976b" ]; then
            echo "::error::The immutable published v3.1.0 tag moved or does not resolve to its audited SHA"
            exit 1
          fi
          cp candidate/backend/tools/HsSqlAgent.SqlCore.Benchmarks/Program.cs baseline/backend/tools/HsSqlAgent.SqlCore.Benchmarks/Program.cs
          cp candidate/backend/tools/HsSqlAgent.SqlCore.Benchmarks/SqlCoreV3Baseline.cs baseline/backend/tools/HsSqlAgent.SqlCore.Benchmarks/SqlCoreV3Baseline.cs
      - name: Capture baseline and candidate .NET 10 public ABI + parse/compile inventory
        shell: bash
        run: |
          set -euo pipefail
          for side in baseline candidate; do
            (cd "$side" && dotnet run --framework net10.0 -c Release --project backend/tools/HsSqlAgent.SqlCore.Benchmarks --               --v3-abi --output "$GITHUB_WORKSPACE/artifacts/v3-$side-abi-net10.json")
            (cd "$side" && dotnet run --framework net10.0 -c Release --no-build --project backend/tools/HsSqlAgent.SqlCore.Benchmarks --               --v3-inventory --output "$GITHUB_WORKSPACE/artifacts/v3-$side-inventory.json")
          done
      - name: ABI removal and classification/diagnostic regression guard
        shell: bash
        run: |
          set -euo pipefail
          jq -r '.signatures[]' artifacts/v3-baseline-abi-net10.json | LC_ALL=C sort -u > artifacts/v3-base-public-signatures.txt
          jq -r '.signatures[]' artifacts/v3-candidate-abi-net10.json | LC_ALL=C sort -u > artifacts/v3-head-public-signatures.txt
          comm -23 artifacts/v3-base-public-signatures.txt artifacts/v3-head-public-signatures.txt > artifacts/v3-removed-public-signatures.txt
          if [ -s artifacts/v3-removed-public-signatures.txt ]; then
            echo "::error::A public CLR signature was removed or changed; inspect v3-removed-public-signatures.txt"
            cat artifacts/v3-removed-public-signatures.txt
            exit 1
          fi
          jq -S . artifacts/v3-baseline-inventory.json > artifacts/v3-base-inventory-normalized.json
          jq -S . artifacts/v3-candidate-inventory.json > artifacts/v3-head-inventory-normalized.json
          if ! diff -u artifacts/v3-base-inventory-normalized.json artifacts/v3-head-inventory-normalized.json > artifacts/v3-inventory-diff.txt; then
            echo "::error::ParseScript / Compile* baseline changed: classification, diagnostics, or compiled evidence"
            sed -n '1,160p' artifacts/v3-inventory-diff.txt
            exit 1
          fi
      - name: Verify C# public contract tests on both supported target frameworks
        shell: bash
        run: |
          set -euo pipefail
          for framework in net8.0 net10.0; do
            (cd candidate && dotnet test backend/src/UnitTest/SqlAgent.Test/SqlAgent.Test.csproj               --framework "$framework" --filter 'FullyQualifiedName~SqlCoreV3BaselineContractsTests')
          done
      - name: Build NuGet packages from exact source revisions
        shell: bash
        run: |
          set -euo pipefail
          for side in baseline candidate; do
            (cd "$side" && dotnet pack -c Release backend/src/Modules/HsSqlAgent.SqlCore/HsSqlAgent.SqlCore.fsproj               --output "$GITHUB_WORKSPACE/artifacts/v3-$side-packages")
          done
      - name: Verify published v3.1.0 NuGet CLR compatibility (net8.0 and net10.0)
        shell: bash
        run: |
          set -euo pipefail
          published="$GITHUB_WORKSPACE/artifacts/HsSqlAgent.SqlCore.3.1.0.published.nupkg"
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors \
            "https://api.nuget.org/v3-flatcontainer/hssqlagent.sqlcore/3.1.0/hssqlagent.sqlcore.3.1.0.nupkg" \
            --output "$published"
          sha256sum "$published" | tee artifacts/v3-published-package-sha256.txt
          candidate="$(find artifacts/v3-candidate-packages -maxdepth 1 -type f -name 'HsSqlAgent.SqlCore.*.nupkg' -print -quit)"
          count="$(find artifacts/v3-candidate-packages -maxdepth 1 -type f -name 'HsSqlAgent.SqlCore.*.nupkg' | wc -l)"
          if [ "$count" -ne 1 ]; then
            echo "::error::Expected exactly one PR-head SqlCore nupkg, found $count"
            exit 1
          fi
          for package in "$published" "$candidate"; do
            for framework in net8.0 net10.0; do
              if ! unzip -Z1 "$package" | grep -Fx "lib/$framework/HsSqlAgent.SqlCore.dll" >/dev/null; then
                echo "::error::Missing $framework CLR assembly in $package"
                exit 1
              fi
            done
          done
          dotnet tool install Microsoft.DotNet.ApiCompat.Tool --version 10.0.100 \
            --tool-path "$RUNNER_TEMP/sqlcore-api-tools"
          "$RUNNER_TEMP/sqlcore-api-tools/apicompat" package "$candidate" \
            --baseline-package "$published" --enable-rule-cannot-change-parameter-name \
            2>&1 | tee artifacts/v3-published-vs-head-apicompat.txt
          {
            echo "### Published NuGet v3.1.0 → PR head API compatibility"
            echo "Immutable release tag: $(cat artifacts/v3-published-tag-sha.txt)"
            echo "Published NuGet SHA-256: $(cut -d' ' -f1 artifacts/v3-published-package-sha256.txt)"
            echo "Both net8.0 and net10.0 assemblies present; ApiCompat passed."
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record exact PR base/head code delta by category
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base="$(cat artifacts/v3-base-sha.txt)"
          head="$(cat artifacts/v3-candidate-sha.txt)"
          git -C candidate fetch --quiet --no-tags --depth=1 origin "$base"
          (cd candidate && dotnet run --framework net10.0 \
            --project backend/tools/HsSqlAgent.TestGovernance -- code-delta \
            --repo . --base "$base" --head "$head" \
            --output "$GITHUB_WORKSPACE/artifacts/v3-code-delta.json") \
            | tee artifacts/v3-code-delta.md
          cat artifacts/v3-code-delta.md >> "$GITHUB_STEP_SUMMARY"

      - name: Measure both compilers using fixed identical corpus on one runner
        shell: bash
        env:
          DOTNET_TieredCompilation: '0'
        run: |
          set -euo pipefail
          for side in baseline candidate; do
            (cd "$side" && dotnet run --framework net10.0 -c Release --no-build --project backend/tools/HsSqlAgent.SqlCore.Benchmarks --               --v3-perf --warmup 10 --iterations 40 --output "$GITHUB_WORKSPACE/artifacts/v3-$side-perf.json")
          done
          jq -r '.results[] | "\(.provider)|\(.case)|\(.outputDigest)"' artifacts/v3-baseline-perf.json | LC_ALL=C sort > artifacts/v3-base-perf-digests.txt
          jq -r '.results[] | "\(.provider)|\(.case)|\(.outputDigest)"' artifacts/v3-candidate-perf.json | LC_ALL=C sort > artifacts/v3-head-perf-digests.txt
          diff -u artifacts/v3-base-perf-digests.txt artifacts/v3-head-perf-digests.txt
      - name: Publish paired p50/p95 and allocation observations (not a noisy hard threshold)
        shell: bash
        run: |
          set -euo pipefail
          jq -n --slurpfile b artifacts/v3-baseline-perf.json \
                --slurpfile h artifacts/v3-candidate-perf.json \
                --rawfile bs artifacts/v3-base-sha.txt \
                --rawfile hs artifacts/v3-candidate-sha.txt '
            ($b[0].results | map({key: (.provider + "|" + .case), value: .}) | from_entries) as $before |
            ($h[0].results | map({key: (.provider + "|" + .case), value: .}) | from_entries) as $after |
            ($before | keys) as $keys |
            if $keys != ($after | keys) or ($keys | length) == 0
            then error("Missing, added or duplicated perf case between exact revisions")
            else {
              schemaVersion: 1, baseSha: ($bs | rtrimstr("\n")),
              headSha: ($hs | rtrimstr("\n")),
              interpretation: "one paired run; investigate >5%; no automatic timing rejection on shared runners",
              cases: [
                $keys[] as $key |
                $before[$key] as $left | $after[$key] as $right |
                if ($left.p50Microseconds <= 0 or $left.p95Microseconds <= 0 or
                    $left.meanAllocatedBytesPerOperation <= 0 or
                    $right.p50Microseconds <= 0 or $right.p95Microseconds <= 0 or
                    $right.meanAllocatedBytesPerOperation <= 0)
                then error("Invalid nonpositive performance measurement: " + $key)
                else {
                  provider: $left.provider, case: $left.case,
                  p50Base: $left.p50Microseconds, p50Head: $right.p50Microseconds,
                  p95Base: $left.p95Microseconds, p95Head: $right.p95Microseconds,
                  allocBase: $left.meanAllocatedBytesPerOperation,
                  allocHead: $right.meanAllocatedBytesPerOperation,
                  p50Ratio: ($right.p50Microseconds / $left.p50Microseconds),
                  p95Ratio: ($right.p95Microseconds / $left.p95Microseconds),
                  allocRatio: ($right.meanAllocatedBytesPerOperation / $left.meanAllocatedBytesPerOperation)
                } end
              ]
            } end
          ' > artifacts/v3-paired-perf-observations.json
          {
            echo "### SqlCore same-runner PR base → PR head benchmark"
            echo "Single paired run; warmup=10, iterations=40. Observations are NOT repeatable production SLOs."
            echo
            echo "| Provider | Case | p50 ratio | p95 ratio | Allocation ratio |"
            echo "| --- | --- | ---: | ---: | ---: |"
            jq -r '.cases | sort_by(.p95Ratio) | reverse | .[:10][] |
              "| \(.provider) | \(.case) | \((.p50Ratio * 100 | round) / 100)x | \((.p95Ratio * 100 | round) / 100)x | \((.allocRatio * 100 | round) / 100)x |"' \
              artifacts/v3-paired-perf-observations.json
            echo
            echo "The table shows the 10 largest p95 ratios, not a complete variance estimate."
          } >> "$GITHUB_STEP_SUMMARY"
          possible="$(jq '[.cases[] | select(.p50Ratio > 1.05 or .p95Ratio > 1.05 or .allocRatio > 1.05)] | length' artifacts/v3-paired-perf-observations.json)"
          if [ "$possible" -gt 0 ]; then
            echo "::warning::$possible compiler benchmark cases exceed 5% on a single paired run. Review p50/p95/alloc and repeat before asserting a significant regression."
          fi

      - name: Upload U0 evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sqlcore-v3-u0-contracts
          path: artifacts/
          if-no-files-found: warn
