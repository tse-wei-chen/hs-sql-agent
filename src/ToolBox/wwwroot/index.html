<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Active</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        .animate-float { animation: float 3s ease-in-out infinite; }
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="bg-[#0f172a] flex items-center justify-center min-h-screen overflow-hidden">
    <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-blue-600/20 rounded-full blur-[120px]"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-indigo-600/20 rounded-full blur-[120px]"></div>

    <div class="glass relative z-10 px-12 py-10 rounded-3xl shadow-2xl text-center max-w-sm w-full mx-4">
        <div class="relative inline-block mb-6">
            <div class="absolute inset-0 bg-blue-500 blur-2xl opacity-30 animate-pulse"></div>
            <div class="text-6xl animate-float relative">⚡</div>
        </div>

        <h1 class="text-3xl font-black mb-3 bg-gradient-to-r from-blue-400 to-emerald-400 bg-clip-text text-transparent tracking-tight">
            SYSTEM ONLINE
        </h1>
        
        <div class="space-y-4">
            <div class="flex items-center justify-center gap-2 text-blue-100/80">
                <span class="relative flex h-3 w-3">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
                </span>
                <p class="font-medium tracking-wide">SQL Agent Running</p>
            </div>
            
            <p class="text-slate-400 text-sm leading-relaxed">
                Service Ready.<br>
                Listening for requests...
            </p>
        </div>

        <div class="mt-8 pt-6 border-t border-white/5">
            <span class="text-[10px] text-slate-500 uppercase tracking-[0.2em]">Node-01 Active</span>
        </div>
    </div>
</body>
</html>
